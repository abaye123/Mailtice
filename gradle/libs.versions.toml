[versions]

kotlin = "2.4.10"
compose-multiplatform = "1.11.1"
# Nucleus 2.4.x is built against the Compose 1.11 train; material3 1.12.x drags compose.ui to 1.12
# and breaks Tao (NoSuchMethodError CanvasLayersComposeScene). Stay on 1.11 -> compose.ui resolves to 1.11.1.
material3 = "1.11.0-alpha07"
agp = "9.1.1"
androidx-activityCompose = "1.12.0"
androidx-work = "2.10.5"
androidx-browser = "1.8.0"
androidx-core = "1.17.0"
# Google Authorization API (AuthorizationClient) - the only Google-approved OAuth path on Android.
play-services-auth = "21.4.0"
sqlDelight = "2.4.0"
sqlite-jdbc = "3.53.2.1"
# Jakarta Mail API + Eclipse Angus implementation. Runs unchanged on the JVM and on Android, and has
# built-in XOAUTH2 that does not depend on Java SASL (which Android lacks). Verify latest on bump.
jakarta-mail-api = "2.1.3"
angus-mail = "2.0.3"
angus-activation = "2.0.2"
netfreetools = "1.2.0"
kotlinx-coroutines = "1.11.0"
ktor = "3.5.2"
androidx-lifecycle = "2.11.0"
androidx-nav3 = "1.2.0-alpha02"
metro = "1.4.1"
kotlinx-datetime = "0.8.0"
materialKolor = "5.0.0"
nucleus = "2.4.7"
# 2.1.0 is the last ComposeNativeTray built on Compose 1.11.1 / Nucleus 2.4.x. From 2.1.3 on it is
# built on Compose 1.12, which would drag compose.ui to 1.12 and break the Tao decorated window.
composenativetray = "2.1.0"
structured-coroutines = "1.1.0"
detekt = "2.0.0-alpha.6"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
compose-rules = "0.6.4"
stability-analyzer = "0.12.0"
aboutLibraries = "15.0.4"
# 1.1.0 is built on Compose 1.11.1 / material3 1.11.0-alpha07; 1.2.0 moves to Compose 1.12.
richeditor = "1.1.0"

